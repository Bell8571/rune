name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: windows-2022
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Build GUI binary
        shell: bash
        run: |
          gcc --version
          go mod download github.com/unstablebuild/rune-go-sdk@v0.2.0
          mod="$(go env GOMODCACHE)/github.com/unstablebuild/rune-go-sdk@v0.2.0"
          if command -v cygpath >/dev/null 2>&1; then
            mod="$(cygpath -u "$mod")"
          fi
          client="$mod/api/workspaceapi/workspacerpc/client.go"
          # rune-go-sdk v0.2.0 reads Unix-only SysProcAttr.Setsid/Setctty
          # and parses D:\ paths as file-URL hosts. No published release
          # fixes either. Patch the module cache before compiling.
          if ! grep -q 'func sessionFlags' "$client"; then
            chmod -R u+w "$mod/api/workspaceapi/workspacerpc"
            patch -d "$mod" -p1 --forward --batch < scripts/rune-go-sdk-windows.patch
          fi
          CGO_ENABLED=1 go build -tags=ebitensinglethread -o bin/rune.exe ./cmd/rune

      - name: Smoke test the built binary
        shell: bash
        run: ./bin/rune.exe --version

      - name: Test graphics packages
        shell: bash
        run: go test -count=1 ./internal/term/gui/wingfx ./internal/term/gui/font

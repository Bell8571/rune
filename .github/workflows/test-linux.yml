name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps `git describe --tags` into the binary, which
          # needs the tag history a shallow clone omits.
          fetch-depth: 0

      - uses: ./.github/actions/setup-build

      # `make` is the build check: it compiles every binary the same way a
      # release does, so a separate `go build ./...` would only recompile
      # the same packages.
      - name: Build binaries
        run: make

      - name: Smoke test the built binary
        run: ./bin/rune --version

      # One instrumented run feeds both the race check and codecov; a
      # separate uninstrumented coverage job re-ran the whole suite.
      - name: Test
        run: |
          xvfb-run -a make test \
            GOTESTFLAGS='-race -timeout 300s -p 1 -coverprofile=coverage.out'

      - uses: codecov/codecov-action@v4
        # The action still exits 1 on a TLS handshake failure to the upload
        # host even when fail_ci_if_error is false. Coverage upload is not
        # the test gate; the Test step above is.
        continue-on-error: true
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: rune-ubuntu-24.04
          path: bin/
          retention-days: 7
